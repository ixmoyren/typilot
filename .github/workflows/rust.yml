# GitHub Actions workflow for the Rust workspace:
# - Install the Rust toolchain declared in 'rust-toolchain.toml'.
# - Test every crate under 'crates/*' on 'ubuntu-latest'.
#
# The plugin build (which consumes the generated WASM/Java artifacts) lives in 'build.yml'.
#
# GitHub Actions reference: https://docs.github.com/actions

name: Rust

on:
  # Trigger the workflow on pushes to only the 'main' branch (this avoids duplicate checks being run e.g., for dependabot pull requests)
  push:
    branches: [ main ]
  # Trigger the workflow on any pull request
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:

  # Run the test suite of every crate under 'crates/*'
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v6

      # Install the Rust toolchain (nightly channel + targets) declared in rust-toolchain.toml
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly

      # Cache the Cargo registry, git checkouts and the target directory
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      # Test all workspace members under 'crates/*' ('xtask' is a build tool, not a crate)
      - name: Run Tests
        run: cargo test --workspace --exclude xtask
